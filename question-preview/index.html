<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="preview-data" content="https://resource-files-dev.starxinteractive.com/preview/knsh-math5.json">
<meta name="preview-appdata" content="https://resource-files-dev.starxinteractive.com/preview/knsh-math5-appdata.json">
<meta name="preview-matching" content="https://resource-files-dev.starxinteractive.com/preview/matching-pairs.json">
<meta name="reviews-api" content="https://companion-api-dev.starxinteractive.com">
<meta name="reviews-token" content="cp-dev-token-change-me">
<meta name="explain-api" content="https://companion-api-dev.starxinteractive.com">
<meta name="preview-explanations" content="https://resource-files-dev.starxinteractive.com/preview/explanations.json">
<meta name="preview-quality" content="https://resource-files-dev.starxinteractive.com/preview/figure-quality.json">
<meta name="preview-courses" content="https://resource-files-dev.starxinteractive.com/preview/courses.json">
<meta name="resource-index" content="https://resource-index-dev.starxinteractive.com">
<title>康軒 數學 五年級 題目預覽</title>
<link rel="stylesheet" href="./styles.css?v=20260916t">
</head>
<body>
<div id="loginGate" class="login-gate" hidden>
  <div class="login-card">
    <h2>題目審查站</h2>
    <p>請輸入通行碼後，選擇你的名字</p>
    <input id="loginCode" type="password" placeholder="通行碼" autocomplete="current-password">
    <button id="loginBtn" type="button">登入</button>
    <p id="loginMsg" class="login-msg"></p>
  </div>
</div>
<header class="topbar">
  <div class="brand"><span class="dot"></span><div><h1 id="courseTitle">題目審查站</h1><p id="subtitle">載入中…</p></div></div>
  <select id="courseSelect" class="me-select" title="切換課程"></select>
  <a id="sourceLink" class="mini-btn" target="_blank" rel="noopener" hidden>來源資源包</a>
  <input id="search" type="search" placeholder="搜尋題目 / 題號 / 課次">
  <div class="mode-switch" title="切換 App 呈現展示方式">
    <span class="mode-label">App 呈現展示方式</span>
    <button type="button" class="mode-btn on" data-mode="quiz">測驗模式</button>
    <button type="button" class="mode-btn" data-mode="answer">解答模式</button>
  </div>
</header>
<div class="filters">
  <select id="fChapter"><option value="">全部章節</option></select>
  <select id="fNode"><option value="">全部知識節點</option></select>
  <select id="fType"><option value="">全部題型</option></select>
  <select id="fStatus"><option value="">全部狀態</option></select>
  <select id="fReview"><option value="">全部審查</option><option value="approved">合格</option><option value="adjust">需調整</option><option value="rejected">不採用</option><option value="none">未設定</option></select>
  <label class="chk"><input id="fImage" type="checkbox"> 只看圖形題</label>
  <label class="chk"><input id="fQuality" type="checkbox"> 只看品質需檢查</label>
  <span class="fsep"></span>
  <span class="mode-label">審查人</span>
  <select id="meSelect" class="me-select"></select>
  <span id="myProgress" class="muted"></span>
  <button id="addReviewer" class="mini-btn" type="button">＋新增</button>
  <button id="logoutBtn" class="mini-btn" type="button">登出</button>
  <button id="assignToggle" class="mini-btn" type="button">審查分配</button>
  <label class="chk"><input id="mineOnly" type="checkbox"> 只看我的待審</label>
</div>
<div id="assignPanel" class="assign-panel" hidden></div>
<main id="list" class="list"></main>
<div id="more" class="more"></div>
<script src="./app.js?v=20260916t"></script>
</body>
</html>
