<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="reviews-api" content="https://companion-api-dev.starxinteractive.com">
  <meta name="reviews-token" content="cp-dev-token-change-me">
  <meta name="courses-url" content="https://resource-files-dev.starxinteractive.com/preview/courses.json">
  <meta name="review-site" content="https://question-preview-dev.starxinteractive.com">
  <title>CoursePass 審題入口</title>
  <link rel="stylesheet" href="./styles.css?v=20260916b">
</head>
<body>
  <div id="loginGate" class="login-gate" hidden>
    <div class="login-card">
      <h2>CoursePass 審題入口</h2>
      <p>請輸入通行碼</p>
      <input id="loginCode" type="password" placeholder="通行碼" autocomplete="current-password">
      <button id="loginBtn" type="button">登入</button>
      <p id="loginMsg" class="login-msg"></p>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>CoursePass 審題入口</h1>
        <p id="subtitle">載入中…</p>
      </div>
    </div>
    <nav class="mainnav" id="mainnav">
      <button id="navDash" class="mini-btn on" type="button">課程審題</button>
      <button id="navBrowse" class="mini-btn" type="button">資源瀏覽</button>
      <button id="logoutBtn" class="mini-btn" type="button">登出</button>
    </nav>
  </header>

  <main id="dash" class="dash">
    <div id="courseCards" class="course-cards"></div>
  </main>

  <div class="layout" id="browser" hidden>
    <aside class="sidebar">
      <div class="side-section">
        <div class="side-title">資源包</div>
        <div id="archives" class="archive-list"></div>
      </div>
    </aside>

    <main class="content">
      <div class="browse-search"><input id="search" type="search" placeholder="搜尋檔名／路徑（例如 月考卷、成語、quesdoc1CH）" autocomplete="off"></div>
      <div class="crumbs">
        <button id="home" class="crumb">全部</button>
        <span id="crumb-path"></span>
      </div>
      <div id="stats" class="stats"></div>

      <div class="viewer">
        <div class="tree-panel">
          <div class="panel-title">目錄</div>
          <div id="tree" class="tree"></div>
        </div>
        <div class="files-panel">
          <div class="panel-title">
            <span>檔案</span>
            <span id="file-count" class="muted"></span>
          </div>
          <div id="folders" class="folder-chips"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>檔案</th><th class="num">大小</th><th class="act"></th></tr></thead>
              <tbody id="files"></tbody>
            </table>
          </div>
          <div id="more" class="more"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="preview" class="preview-overlay" hidden>
    <div class="preview-dialog">
      <div class="preview-head">
        <span id="preview-title"></span>
        <span id="preview-note" class="preview-note"></span>
        <button id="preview-close" class="preview-close">✕ 關閉</button>
      </div>
      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>

  <script src="./mammoth.browser.min.js"></script>
  <script src="./app.js?v=20260916b"></script>
</body>
</html>
